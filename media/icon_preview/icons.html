<!DOCTYPE html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#f3efe9;font-family:Arial;padding:40px;color:#1c2b33}
h2{font-weight:600;font-size:20px;margin:30px 0 10px}
.row{display:flex;gap:28px;flex-wrap:wrap;margin-bottom:10px}
.cell{width:150px;text-align:center}
.cell .lab{font-size:12px;color:#5a6a72;margin-top:8px}
.ic{width:150px;height:110px;background:#fff;border-radius:16px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 10px rgba(28,43,51,.08)}
svg{width:52px;height:52px}
</style></head><body>
<h2>Стиль 1 — тонкие контурные (line, stroke 1.5, совр. премиум)</h2>
<div class="row" id="s1"></div>
<h2>Стиль 2 — с мягкой заливкой (glyph, ровный вектор)</h2>
<div class="row" id="s2"></div>
<script>
// SVG-паттерны: имя -> (lineSVG, glyphSVG)
// Сетка viewBox 0 0 48 48
const L=(d,s='none',sw=1.5)=>`<path d="${d}" fill="${s}" stroke="#1c2b33" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round"/>`;
const G=(d,f)=>{};
const icons=[
 {n:'Магазин', line:`<path d="M4 9h40l-3 28H7L4 9z" fill="none" stroke="#1c2b33" stroke-width="1.6"/><path d="M16 21a8 8 0 0 0 16 0" fill="none" stroke="#1c2b33" stroke-width="1.6" stroke-linecap="round"/>`},
 {n:'Услуги', line:`<path d="M16 24h16M24 8v32" stroke="#1c2b33" stroke-width="1.6" stroke-linecap="round" fill="none"/>`},
 {n:'Инфобизнес', line:`<circle cx="24" cy="24" r="18" fill="none" stroke="#1c2b33" stroke-width="1.6"/><path d="M17 19l10 10M27 19L17 29" stroke="#1c2b33" stroke-width="1.6" stroke-linecap="round" fill="none"/>`},
 {n:'Кафе', line:`<path d="M8 12h24v14a8 8 0 0 1-16 0V12" fill="none" stroke="#1c2b33" stroke-width="1.6" stroke-linecap="round"/><path d="M14 12v-4M20 12V6M26 12V6" stroke="#1c2b33" stroke-width="1.6" stroke-linecap="round" fill="none"/><path d="M32 18h3a5 5 0 0 1 0 10h-3" fill="none" stroke="#1c2b33" stroke-width="1.6" stroke-linecap="round"/>`},
 {n:'Портфолио', line:`<rect x="8" y="8" width="32" height="32" rx="3" fill="none" stroke="#1c2b33" stroke-width="1.6"/><circle cx="17" cy="17" r="3" fill="none" stroke="#1c2b33" stroke-width="1.6"/><path d="M8 32l10-10 8 8 6-6 8 8" fill="none" stroke="#1c2b33" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>`},
 {n:'Помощник', line:`<rect x="14" y="6" width="20" height="14" rx="3" fill="none" stroke="#1c2b33" stroke-width="1.6"/><path d="M22 32h4M24 20v10" stroke="#1c2b33" stroke-width="1.6" stroke-linecap="round" fill="none"/><path d="M14 40h20" stroke="#1c2b33" stroke-width="1.6" stroke-linecap="round" fill="none"/>`},
 {n:'Календарь', line:`<rect x="8" y="10" width="32" height="30" rx="3" fill="none" stroke="#1c2b33" stroke-width="1.6"/><path d="M14 4v8M34 4v8M8 20h32" stroke="#1c2b33" stroke-width="1.6" stroke-linecap="round" fill="none"/>`},
 {n:'Авто-ция', line:`<circle cx="24" cy="24" r="6" fill="none" stroke="#1c2b33" stroke-width="1.6"/><path d="M24 4v6M24 38v6M4 24h6M38 24h6" stroke="#1c2b33" stroke-width="1.6" stroke-linecap="round" fill="none"/>`},
 {n:'Чат-бот', line:`<path d="M12 6h24a4 4 0 0 1 4 4v14a4 4 0 0 1-4 4H20l-8 8V10a4 4 0 0 1 4-4z" fill="none" stroke="#1c2b33" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="18" cy="17" r="1.4" fill="#1c2b33"/><circle cx="24" cy="17" r="1.4" fill="#1c2b33"/><circle cx="30" cy="17" r="1.4" fill="#1c2b33"/>`},
 {n:'Заявка', line:`<path d="M24 4v28M12 20l12 12 12-12" stroke="#1c2b33" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M8 40h32" stroke="#1c2b33" stroke-width="1.6" stroke-linecap="round" fill="none"/>`},
 {n:'Готово', line:`<circle cx="24" cy="24" r="18" fill="none" stroke="#1c2b33" stroke-width="1.6"/><path d="M16 24l6 6 10-12" stroke="#1c2b33" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>`},
 {n:'Результат', line:`<path d="M8 36V26M19 36V18M30 36V10M41 36H4" stroke="#1c2b33" stroke-width="1.6" stroke-linecap="round" fill="none"/>`},
];
const s1=document.getElementById('s1');
icons.forEach(it=>{const c=document.createElement('div');c.className='cell';c.innerHTML=`<div class="ic"><svg viewBox="0 0 48 48">${it.line}</svg></div><div class="lab">${it.n}</div>`;s1.appendChild(c)});
// Стиль 2: та же форма, но с мягкой заливкой через дублирование
const s2=document.getElementById('s2');
icons.forEach(it=>{const c=document.createElement('div');c.className='cell';c.innerHTML=`<div class="ic"><svg viewBox="0 0 48 48">${it.line.replaceAll('stroke="#1c2b33" stroke-width="1.6"','stroke="#ffab72" stroke-width="2"')}</svg></div><div class="lab">${it.n} (акцент)</div>`;s2.appendChild(c)});
</script></body></html>
